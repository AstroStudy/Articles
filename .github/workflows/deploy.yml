name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or whatever your default branch is
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # THIS IS THE MAGIC STEP
      # It finds the placeholder in your code and replaces it with the secret
      - name: Inject Excel URL Secret
        run: |
          sed -i 's|{{DATA_TABLE_URL}}|${{ secrets.DATA_TABLE_URL }}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
