name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Or whatever your default branch is
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Using 'env' and 'perl' safely injects URLs containing special characters like '&'
      - name: Inject Excel URL Secret
        env:
          SECRET_URL: ${{ secrets.DATA_TABLE_URL }}
        run: |
          perl -pi -e 's|\{\{DATA_TABLE_URL\}\}|$ENV{SECRET_URL}|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
